name: "Build and Release"

permissions:
  contents: write
  packages: read

on:
  workflow_dispatch:

jobs:
  build-job:
    timeout-minutes: 60
    name: Build Release Packages
    runs-on: windows-latest
    outputs:
      VERSION: ${{ steps.extract_info.outputs.VERSION }}
      NAME: ${{ steps.extract_info.outputs.NAME }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and name from version.txt (required)
        id: extract_info
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Require explicit version from version.txt (repo root). Do not fall back to tags.
          if (-not (Test-Path -Path version.txt)) {
            Write-Error "version.txt not found in repository root. Please add version.txt with the release version."
            exit 1
          }

          $VERSION = (Get-Content -Path version.txt -Raw).Trim()
          if (-not $VERSION) {
            Write-Error "version.txt is empty. Please put the release version in version.txt."
            exit 1
          }

          $NAME = ($env:GITHUB_REPOSITORY -split '/')[ -1 ]

          Add-Content -Path $env:GITHUB_OUTPUT -Value "VERSION=$VERSION"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "NAME=$NAME"

      - name: Create release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path 'GenericJingles','GoalHorn','GoalJingles','PenaltyJingles','SpecialJingles' -DestinationPath "release\eu.fbtools-BasicJinglePack_${{ steps.extract_info.outputs.VERSION }}.zip" -Force
   
          # TBD when runner supports Inno Setup 6.5
          # # Decode secret and write key file (binary-safe)
          # $bytes = [System.Convert]::FromBase64String($env:ISSIGTOOL_KEY)
          # [IO.File]::WriteAllBytes('MyKey.isprivatekey', $bytes)
          # ISSigTool.exe --key-file="MyKey.isprivatekey" sign "release/eu.fbtools-BasicJinglePack_${{ steps.extract_info.outputs.VERSION }}.zip"
          # Remove-Item -Path "MyKey.isprivatekey" -Force
          # env:
          #   ISSIGTOOL_KEY: ${{ secrets.ISSIGTOOL_KEY }}

      - name: Determine Release Type
        id: release_type
        run: |
          if ('${{ github.ref }}' -eq 'refs/heads/main') {
            echo "IS_PRERELEASE=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "IS_PRERELEASE=true" >> $env:GITHUB_OUTPUT
          }

      - name: "Archive artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: release-BasicJinglePack-${{ steps.extract_info.outputs.VERSION }}
          path: "release"
          
      - name: Get Changelog  Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.extract_info.outputs.VERSION }}
          path: ./CHANGELOG.md

      - name: Publish archives and packages
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.changelog_reader.outputs.version }}
          tag_name: "v${{ steps.changelog_reader.outputs.version }}"
          body: ${{ steps.changelog_reader.outputs.changes }}
          prerelease: ${{ steps.changelog_reader.outputs.status == 'prereleased' }}
          draft: ${{ steps.changelog_reader.outputs.status == 'unreleased' }}
          files: release*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


